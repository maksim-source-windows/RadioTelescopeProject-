<circle cx="290" cy="220.0" r="3" fill="#c00"/>
<rect x="275.0" y="174.0" width="30.0" height="17.5" fill="#f80" stroke="#333"/>
<text x="290" y="187.0" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">SAW</text>
<rect x="272.5" y="146.5" width="35.0" height="27.5" fill="#4a90d9" stroke="#333"/>
<text x="290" y="163.0" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">LNA</text>
<polyline points="307.5,160.0 530,160.0 530,490" class="md" stroke-dasharray="6,4"/>
<rect x="495" y="490" width="70" height="26" fill="#333"/><text x="530" y="508" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">RTL-SDR</text>
<text x="522" y="300" text-anchor="end" class="l">кабель RG-58</text><text x="522" y="313" text-anchor="end" class="l">(после LNA)</text>
<text x="266.5" y="163.5" text-anchor="end" class="l">LNA BGA2869 (вплотную)</text>
<text x="269.0" y="186.0" text-anchor="end" class="l">SAW (опционально, calculations 5.1)</text>
<text x="345.0" y="197.5" class="l">рефлектор 20×20 см</text>
<text x="330.0" y="236.0" class="l">BiQuad (в фокусе)</text>
<text x="290" y="454" text-anchor="middle" class="l">вершина параболы</text>
<line x1="152.5" y1="470" x2="427.5" y2="470" class="dl"/>
<line x1="152.5" y1="465" x2="152.5" y2="475" class="dl"/>
<line x1="427.5" y1="465" x2="427.5" y2="475" class="dl"/>
<text x="290" y="486" text-anchor="middle" class="d">D = 55 см</text>
<line x1="115" y1="430" x2="115" y2="220.0" class="dl"/>
<line x1="110" y1="430.0" x2="120" y2="430.0" class="dl"/>
<line x1="110" y1="220.0" x2="120" y2="220.0" class="dl"/>
<text x="107" y="325.0" text-anchor="end" class="d">F = 42 см</text>
<text x="107" y="339.0" text-anchor="end" class="d">(от вершины)</text>
<line x1="449.5" y1="407.5" x2="449.5" y2="430" class="dl"/>
<line x1="444.5" y1="407.5" x2="454.5" y2="407.5" class="dl"/>
<line x1="444.5" y1="430.0" x2="454.5" y2="430.0" class="dl"/>
<text x="457.5" y="422.8" class="d">h = 4.5 см</text>
<line x1="230.0" y1="220.0" x2="230.0" y2="193.5" class="dl"/>
<line x1="225.0" y1="220.0" x2="235.0" y2="220.0" class="dl"/>
<line x1="225.0" y1="193.5" x2="235.0" y2="193.5" class="dl"/>
<text x="222.0" y="210.8" text-anchor="end" class="d">5.3 см</text>
<text x="30" y="682" class="l">Формула F = (D/2)²/(4h) верна для симметричной параболы.</text>
<text x="30" y="696" class="l">Для офсетной тарелки найдите фокус по сигналу; положение облучателя отличается.</text>
<rect x="600" y="70" width="380" height="330" fill="white" stroke="#333"/>
<text x="610" y="90" class="h">BiQuad, вид спереди (1 см = 10 px)</text>
<rect x="690" y="135" width="200" height="200" fill="#eee" stroke="#888" stroke-dasharray="5,4"/>
<text x="790" y="151" text-anchor="middle" class="l" fill="#666">рефлектор 20×20 см (за BiQuad)</text>
<polygon points="752.66,197.66 790.00,235 752.66,272.34 715.33,235" class="th"/>
<polygon points="827.34,197.66 864.67,235 827.34,272.34 790.00,235" class="th"/>
<circle cx="788" cy="235" r="2.2" fill="#c00"/><circle cx="792" cy="235" r="2.2" fill="#c00"/>
<text x="790" y="290" text-anchor="middle" font-size="10" fill="#c00">точка питания, зазор 3 мм</text>
<text x="744.7" y="193.7" text-anchor="end" class="d">сторона 5.28 см (λ/4)</text>
<line x1="715.3" y1="351" x2="864.7" y2="351" class="dl"/>
<line x1="715.3" y1="346" x2="715.3" y2="356" class="dl"/>
<line x1="864.7" y1="346" x2="864.7" y2="356" class="dl"/>
<text x="790" y="366" text-anchor="middle" class="d">ширина 14.9 см</text>
<line x1="902" y1="197.7" x2="902" y2="272.3" class="dl"/>
<line x1="897" y1="197.7" x2="907" y2="197.7" class="dl"/>
<line x1="897" y1="272.3" x2="907" y2="272.3" class="dl"/>
<text x="910" y="239" class="d">7.47 см</text>
<text x="610" y="392" class="l">Проволока: 8 × 5.28 = 42.2 см (взять 45-50 см), медь ∅ 2-4 мм</text>
<rect x="600" y="420" width="380" height="290" fill="white" stroke="#333"/>
<text x="610" y="440" class="h">Размеры (λ = 21.1 см)</text>
<text x="612" y="466" class="l">Парабола: D 55 см, h 4.5 см, F 42 см (расчёт)</text>
<text x="612" y="486" class="l">Усиление ≈ 15.7 дБи (η = 0.55), луч ≈ 27°</text>
<text x="612" y="506" class="l">BiQuad: сторона λ/4 = 5.28 см, 2 ромба</text>
<text x="612" y="526" class="l">  ширина 14.9 см, высота 7.47 см, зазор 3 мм</text>
<text x="612" y="546" class="l">Рефлектор: не менее 20×20 см, расстояние 5.3 см</text>
<text x="612" y="566" class="l">SAW-фильтр (опционально): потери ~1.5 дБ</text>
<text x="612" y="586" class="l">LNA BGA2869: NF ~3.1 дБ, 32 дБ, питание 5 В</text>
<text x="612" y="606" class="l">Кабель RG-58 ≈ 0.85 дБ/м на 1.42 ГГц</text>
<text x="612" y="626" class="l">Частота линии HI: 1420.405752 МГц</text>
<line x1="612" y1="672" x2="712" y2="672" stroke="#000" stroke-width="2"/><line x1="612" y1="667" x2="612" y2="677" stroke="#000"/><line x1="712" y1="667" x2="712" y2="677" stroke="#000"/>
<text x="722" y="676" class="l">10 см (вид сбоку: 50 px)</text>
<rect x="20" y="725" width="960" height="165" fill="white" stroke="#333"/>
<text x="30" y="745" class="h">Примечания</text>
<text x="30" y="766" class="l">• BiQuad: два квадрата со стороной 5.28 см, повёрнутые на 45° (ромбы); вершины сходятся в точке питания (жила и оплётка кабеля).</text>
<text x="30" y="783" class="l">• Цепь: BiQuad → [SAW, опционально] → LNA (вплотную) → RG-58 → RTL-SDR. SAW можно поставить и после LNA (шум ниже, но LNA легче перегрузить):</text>
<text x="30" y="800" class="l">   calculations.txt, раздел 5.1.</text>
<text x="30" y="817" class="l">• LNA питается 4.5-5.5 В. Bias-T RTL-SDR Blog v4 даёт около 4.5 В: проверьте, при просадке дайте отдельные 5 В. 12 В на BGA2869 нельзя.</text>
<text x="30" y="834" class="l">• Все соединения: пайка или качественные SMA; защитить LNA от влаги.</text>
<text x="30" y="851" class="l">• BiQuad юстировать вдоль оси по максимуму сигнала (допуск положения ±2 см).</text>
<text x="30" y="868" class="l">• Размеры под другие частоты: калькулятор в index.html, файл dimensions.md.</text>
</svg>