<polyline points="152.5,407.5 159.4,409.7 166.2,411.8 173.1,413.7 180.0,415.6 186.9,417.3 193.8,419.0 200.6,420.5 207.5,421.9 214.4,423.2 221.2,424.4 228.1,425.4 235.0,426.4 241.9,427.2 248.8,428.0 255.6,428.6 262.5,429.1 269.4,429.5 276.2,429.8 283.1,429.9 290.0,430.0 296.9,429.9 303.8,429.8 310.6,429.5 317.5,429.1 324.4,428.6 331.2,428.0 338.1,427.2 345.0,426.4 351.9,425.4 358.8,424.4 365.6,423.2 372.5,421.9 379.4,420.5 386.2,419.0 393.1,417.3 400.0,415.6 406.9,413.7 413.8,411.8 420.6,409.7 427.5,407.5" class="th" stroke-width="3"/>
